<meta charset="utf-8">
<title>Phòng luyện VSTEP B2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky skill-tab rail over one 980px workbench column; exam-paper surfaces; correct answers get a teacher's marker circle */
:root{
  --paper:#F3F3EE; --surface:#FFFFFF; --sunk:#EBECE5; --ink:#172036; --muted:#596178; --line:#D9DAD1;
  --navy:#22407F; --navy-soft:#E5EBF7; --accent:#D2621A; --accent-soft:#FBE8D9;
  --ok:#1C7A4B; --ok-soft:#DDF1E5; --bad:#B3261E; --bad-soft:#FBE4E1; --warn:#9A6400; --warn-soft:#FBF0D6;
  --f-ui:"Be Vietnam Pro", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151D; --surface:#1A1F2A; --sunk:#151A23; --ink:#E7E9EF; --muted:#A0A7B7; --line:#2C3443;
  --navy:#93B1F5; --navy-soft:#1E2943; --accent:#F08C48; --accent-soft:#3A2819;
  --ok:#62C792; --ok-soft:#16301F; --bad:#F2887D; --bad-soft:#3A1D1A; --warn:#E8B85A; --warn-soft:#33290F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#1A1F2A; --sunk:#151A23; --ink:#E7E9EF; --muted:#A0A7B7; --line:#2C3443;
  --navy:#93B1F5; --navy-soft:#1E2943; --accent:#F08C48; --accent-soft:#3A2819;
  --ok:#62C792; --ok-soft:#16301F; --bad:#F2887D; --bad-soft:#3A1D1A; --warn:#E8B85A; --warn-soft:#33290F;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important} /* also when the file is opened directly, outside the artifact skeleton */
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--navy)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + tabs */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;padding-block:14px 10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand .lvl{font-family:var(--f-mono);font-weight:600;font-size:.8rem;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:1px 8px;transform:rotate(-3deg);display:inline-block}
.top .src{font-size:.8rem;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:11px 12px 9px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
main{padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:18px}

/* shared */
.sec-head{display:flex;flex-direction:column;gap:6px}
.lede{color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent;border-style:dashed}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.grid2>*,.grid3>*{min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--navy)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--navy-soft);color:var(--navy)}
.tag.ctu{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{width:100%;resize:vertical;line-height:1.6}
details>summary{cursor:pointer;font-weight:600;color:var(--navy)}
details[open]>summary{margin-bottom:8px}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.88rem}
.note b{color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* score scale */
.scale{position:relative;height:38px;margin-top:6px}
.scale .bar{position:absolute;inset:12px 0 auto;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--sunk) 0 40%,var(--navy-soft) 40% 60%,var(--accent-soft) 60% 85%,var(--ok-soft) 85% 100%);border:1px solid var(--line)}
.scale .tick{position:absolute;top:0;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);transform:translateX(-50%)}
.scale .tick::after{content:"";display:block;width:1px;height:26px;background:var(--line);margin:2px auto 0}
.scale .lab{position:absolute;bottom:-4px;font-size:.72rem;font-weight:700;transform:translateX(-50%)}
.target-line{position:absolute;top:6px;height:22px;width:2px;background:var(--accent);left:60%}

/* stats */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:.82rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--navy)}

/* options with marker circle */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt .L{flex:none;width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:.85rem;border-radius:50%}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .L{box-shadow:0 0 0 2px var(--accent);transform:rotate(-8deg) scale(1.1);color:var(--accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt.picked::after{margin-left:auto;padding-left:10px;font-weight:800;font-size:1.05rem;line-height:24px}
.opt.correct.picked::after{content:"✓";color:var(--ok)}
.opt.wrong.picked::after{content:"✗";color:var(--bad)}
.fb{font-size:.88rem;padding:8px 10px;border-radius:8px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--navy-soft);color:var(--ink)}

/* listening */
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:600;cursor:pointer}
.dot[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.wave i{width:3px;background:var(--navy);border-radius:2px;height:4px}
.wave.on i{animation:w 0.9s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.15s}.wave.on i:nth-child(3){animation-delay:.3s}.wave.on i:nth-child(4){animation-delay:.45s}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.wave.on i{animation:none;height:12px}}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{font-size:.85rem;padding:2px 9px;border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
.gap-text{font-family:var(--f-read);font-size:1.02rem;line-height:2.1}
.gap-text select{font-family:var(--f-ui);font-size:.88rem;padding:2px 6px;margin:0 2px;max-width:100%}
.gap-text select.ok{border-color:var(--ok);background:var(--ok-soft)}
.gap-text select.bad{border-color:var(--bad);background:var(--bad-soft)}
.transcript{font-family:var(--f-read);line-height:1.8;background:var(--sunk);border-radius:8px;padding:12px 14px}
.transcript b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.gap-text,.transcript{white-space:pre-line}
.opt-why{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:4px}
.opt-why li.sel{color:var(--ok);font-weight:600}
.wk-h{margin:8px 0 -4px}
.audio-list{display:flex;flex-wrap:wrap;gap:6px}
.audio-card audio{width:100%}

/* reading */
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.pitem{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pitem:hover{border-color:var(--navy)}
.pitem .best{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.read-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.read-grid{grid-template-columns:1fr}}
.passage{font-family:var(--f-read);font-size:1.02rem;line-height:1.75;display:flex;flex-direction:column;gap:12px}
.passage b{background:var(--accent-soft);padding:0 2px;border-radius:2px}
@media (min-width:821px){.passage-card{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:600}
.why{font-size:.86rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}

/* writing */
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.editor-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem}
.wc{font-family:var(--f-mono);font-weight:600}
.wc.low{color:var(--bad)} .wc.good{color:var(--ok)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;background:var(--sunk)}
.clock.low{color:var(--warn);background:var(--warn-soft)}
.clock.done{color:var(--bad);background:var(--bad-soft)}
.prompt{font-family:var(--f-read);font-size:1.02rem;line-height:1.7;background:var(--sunk);border-left:3px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 14px}
.tmpl{font-family:var(--f-mono);font-size:.84rem;line-height:1.7;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px}
.cls-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.cls-item:last-child{border-bottom:0}
.cls-item .txt{flex:1 1 260px;min-width:0}

/* AI result */
.ai-box{display:none}
body.has-ai .ai-box{display:block}
.ai-off{display:none}
body.no-ai .ai-off{display:block}
.grade-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.grade-score{font-family:var(--f-mono);font-size:2.2rem;font-weight:600;line-height:1}
.crit{display:grid;grid-template-columns:minmax(0,150px) 44px minmax(0,1fr);gap:4px 12px;align-items:start;font-size:.9rem;padding:6px 0;border-bottom:1px solid var(--line)}
.crit .s{font-family:var(--f-mono);font-weight:600}
@media (max-width:560px){.crit{grid-template-columns:1fr 44px}.crit .c{grid-column:1/-1}}
.err-row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.err-row .o{text-decoration:line-through;color:var(--bad)}
.err-row .f{color:var(--ok);font-weight:600}
.improved{font-family:var(--f-read);white-space:pre-wrap;line-height:1.7;background:var(--sunk);border-radius:8px;padding:12px}

/* speaking */
.mind{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;gap:10px;align-items:center;justify-items:center;padding:8px 0}
.mind .center{grid-column:2;grid-row:2;background:var(--navy);color:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;text-align:center;max-width:260px}
.mind .n{border:1.5px solid var(--navy);border-radius:999px;padding:6px 14px;font-size:.88rem;text-align:center;background:var(--surface);max-width:220px}
.mind .n.you{border-style:dashed;color:var(--muted)}
.mind .n1{grid-column:1/4;grid-row:1}.mind .n2{grid-column:1;grid-row:2}.mind .n3{grid-column:3;grid-row:2}.mind .n4{grid-column:1/4;grid-row:3}
@media (max-width:560px){.mind{grid-template-columns:1fr}.mind .center,.mind .n1,.mind .n2,.mind .n3,.mind .n4{grid-column:1;grid-row:auto}}
.ql{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ql li{display:flex;gap:8px;align-items:flex-start}
.ql li .t{flex:1;min-width:0}
.speak-btn{flex:none;padding:3px 9px;font-size:.8rem}
.phase{font-weight:700;font-size:.85rem}

/* vocab */
.flash{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;user-select:none}
.flash .w{font-family:var(--f-read);font-size:2rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.flash .m{font-size:1.15rem;color:var(--navy);font-weight:600}
.flash .hint{font-size:.8rem;color:var(--muted)}
.flash.known{box-shadow:inset 0 0 0 2px var(--ok)}
.prog{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.wordlist{columns:2 240px;column-gap:24px;font-size:.88rem}
.wordlist div{break-inside:avoid;padding:3px 0;border-bottom:1px dotted var(--line)}
.wordlist div.k{color:var(--muted)}
.wordlist b{font-weight:600}
.pron{gap:8px;padding:12px 14px}
.rec-btn.on{background:var(--bad);border-color:var(--bad);animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.rec-btn.on{animation:none}}
.pron-msg{margin:0;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.pron-msg.ok{color:var(--ok);background:var(--ok-soft)}
.pron-msg.warn{color:var(--warn);background:var(--warn-soft)}
.pron-msg.bad{color:var(--bad);background:var(--bad-soft)}

/* grammar */
.gq{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.gq:last-child{border-bottom:0}
.gq .opts{flex-direction:row;flex-wrap:wrap}
.gq .opt{width:auto;padding:5px 12px}
.gq input[type=text]{min-width:0;flex:1 1 180px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Phòng luyện VSTEP</h1><span class="lvl">B2 · 6.0+</span></div>
    <p class="src">Bám theo giáo trình tuần 1–2, Trung tâm Ngoại ngữ ĐH Cần Thơ · bài luyện do Claude soạn</p>
  </div>
</header>
<nav class="tabs" aria-label="Kỹ năng">
  <div class="wrap" role="tablist">
    <button data-v="tong-quan" role="tab">Tổng quan</button>
    <button data-v="nghe" role="tab">Nghe</button>
    <button data-v="doc" role="tab">Đọc</button>
    <button data-v="viet" role="tab">Viết</button>
    <button data-v="noi" role="tab">Nói</button>
    <button data-v="tu-vung" role="tab">Từ vựng</button>
    <button data-v="ngu-phap" role="tab">Ngữ pháp</button>
  </div>
</nav>
<main class="wrap">
  <section class="view" id="v-tong-quan"></section>
  <section class="view" id="v-nghe" hidden></section>
  <section class="view" id="v-doc" hidden></section>
  <section class="view" id="v-viet" hidden></section>
  <section class="view" id="v-noi" hidden></section>
  <section class="view" id="v-tu-vung" hidden></section>
  <section class="view" id="v-ngu-phap" hidden></section>
</main>

<script>
/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LETTERS = ["A", "B", "C", "D", "E"];
const words = t => (t.trim().match(/\S+/g) || []).length;
function rich(s, tag = "p") { // **bold** markup
  const p = el(tag);
  s.split("**").forEach((part, i) => { if (part) p.append(i % 2 ? el("b", { text: part }) : document.createTextNode(part)); });
  return p;
}

/* ---------------- storage (per-viewer convenience) ---------------- */
const STORE_KEY = "vstep-b2-v1";
let S = { listen: {}, read: {}, known: {}, drafts: {}, gram: {}, days: [], examDate: "" };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function markDay() { const d = new Date().toISOString().slice(0, 10); if (!S.days.includes(d)) { S.days.push(d); save(); } }

/* ---------------- text to speech ---------------- */
const TTS = {
  voice: null, rate: 0.95,
  ok() { return "speechSynthesis" in window; },
  init() {
    if (!this.ok()) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();

  speak(text, onend) {

/* ---------------- pronunciation check (speech recognition) ---------------- */
const PRON = {
  SR: window.SpeechRecognition || window.webkitSpeechRecognition || null,
  stopCur: null,
  norm(s) { return s.toLowerCase().replace(/\(.*?\)/g, "").replace(/[’`]/g, "'").replace(/-/g, " ").replace(/[^a-z' ]/g, "").replace(/\s+/g, " ").trim(); },
  lev(a, b) {
    const d = Array.from({ length: b.length + 1 }, (_, j) => j);
    for (let i = 1; i <= a.length; i++) {
      let prev = d[0]; d[0] = i;
      for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }
    }
    return d[b.length];
  },
  sim(a, b) { const m = Math.max(a.length, b.length); return m ? 1 - this.lev(a, b) / m : 1; },
  abort() { if (this.stopCur) this.stopCur(true); }
};

function pronBox(word) {
  const target = word.replace(/\(.*?\)/g, "").trim(), nt = PRON.norm(target);
  const res = el("div", { class: "pron-res", "aria-live": "polite" });

    res.append(el("p", { class: "small muted", text: "Trình duyệt này không hỗ trợ kiểm tra phát âm. Hãy mở trang bằng Chrome hoặc Edge." }));

    } else {
      res.replaceChildren(el("p", { class: "pron-msg bad" }, el("b", { text: "✗ Chưa đúng. " }), `Máy nghe thành “${top}”. Bấm “Nghe phát âm” để nghe mẫu rồi đọc chậm, rõ từng âm tiết.`));
    }
  }

    if (!busy) return;

    try { rec.stop(); } catch (e) { finish(); }
  }

    btn.classList.add("on"); btn.replaceChildren("■ Dừng");

/* ---------------- timer ---------------- */
function Timer() {
  const d = el("span", { class: "clock", text: "--:--" });
  let id = null, left = 0, onDone = null;
  const fmt = s => (s < 0 ? "+" : "") + String(Math.floor(Math.abs(s) / 60)).padStart(2, "0") + ":" + String(Math.abs(s) % 60).padStart(2, "0");
  function tick() {
    left--; d.textContent = fmt(left);
    d.classList.toggle("low", left <= 30 && left > 0);
    if (left === 0) { d.classList.add("done"); const f = onDone; onDone = null; f && f(); }
  }
  return {
    el: d,
    start(sec, cb) { clearInterval(id); left = sec; onDone = cb; d.classList.remove("done", "low"); d.textContent = fmt(left); id = setInterval(tick, 1000); },
    stop() { clearInterval(id); id = null; },
    reset() { clearInterval(id); id = null; d.classList.remove("done", "low"); d.textContent = "--:--"; }
  };
}

  { id: "r-fourday", title: "The four-day work week", type: "Tổng hợp · mức B2", skill: "mixed",
    paras: ["For more than a century, the five-day, forty-hour week has been the standard pattern of working life in most industrialised countries. Recently, however, a growing number of companies have begun to experiment with a four-day week, in which employees work fewer hours but receive the same salary.",
      "One of the largest trials took place in the United Kingdom in 2022, when around sixty organisations, ranging from small bakeries to financial firms, reduced their staff's working time for six months. At the end of the trial, the vast majority of these companies chose to continue with the new schedule. Managers reported that productivity had remained stable, while staff said they felt less stressed and slept better. Moreover, the number of employees who **resigned** during the period fell considerably.",
      "Supporters argue that a shorter week forces people to work more efficiently. Long, unnecessary meetings are cut, and workers concentrate harder because they know they have less time. **They** also point out that an extra day off allows parents to spend more time with their children and gives everyone a chance to rest properly.",
      "Critics, on the other hand, are less convinced. They note that the model is difficult to apply in sectors such as healthcare, transport and retail, where services must be available every day. In these industries, reducing hours may simply mean hiring more staff, which raises costs. Others worry that some employees will try to squeeze five days of work into four, which could lead to longer and more exhausting working days.",
      "It seems unlikely that the four-day week will become universal in the near future. Nevertheless, the trials have encouraged employers to rethink an idea that was once considered fixed: that more hours always mean more results."],
    qs: [
      { q: "What is the passage mainly about?", o: ["Why British companies pay higher salaries", "The results of, and debate around, a shorter working week", "How to reduce stress at work", "The history of the forty-hour week"], a: 1, why: "Câu hỏi ý chính: đọc câu chủ đề mỗi đoạn (skimming)." },
      { q: "The word “resigned” in paragraph 2 is closest in meaning to", o: ["complained", "left their jobs", "were promoted", "worked overtime"], a: 1, why: "resign = nghỉ việc." },
      { q: "According to paragraph 2, what happened after the UK trial?", o: ["Productivity fell slightly", "Most companies kept the new schedule", "Workers received lower salaries", "Only financial firms took part"], a: 1, why: "“the vast majority… chose to continue” = most companies kept it." },
      { q: "The word “They” in paragraph 3 refers to", o: ["long meetings", "workers", "supporters", "parents"], a: 2, why: "Chủ ngữ của đoạn 3 là “Supporters argue…”." },
      { q: "Which sector is NOT mentioned as difficult for the four-day week?", o: ["Healthcare", "Transport", "Education", "Retail"], a: 2, why: "Bài liệt kê healthcare, transport, retail." },
      { q: "It can be inferred from the last paragraph that the author thinks", o: ["the four-day week will soon be used everywhere", "the trials have changed how employers think about working hours", "longer hours always produce better results", "the trials were a failure"], a: 1, why: "“encouraged employers to rethink” → thay đổi cách nghĩ." }
    ]},
  { id: "r-trees", title: "Why cities need trees", type: "Tổng hợp · mức B2", skill: "mixed",
    paras: ["When people think of city planning, they usually imagine roads, buildings and public transport. Trees are often treated as decoration, something to be added if there is money left over. A growing body of research, however, suggests that urban trees are not a **luxury** but a necessity.",
      "The most obvious benefit is temperature control. Concrete and asphalt absorb heat during the day and release it at night, so city centres are often several degrees warmer than the surrounding countryside. This effect, known as the urban heat island, can be reduced significantly by trees, which provide shade and release water vapour through their leaves.",
      "Trees also improve people's health. **Their** leaves trap dust and other small particles, making the air cleaner to breathe. Studies have found that residents who live near green spaces tend to report lower levels of stress, and some hospital patients with a view of trees have been observed to recover more quickly than those facing a wall.",
      "There are economic advantages, too. Shops on tree-lined streets often attract more customers, and houses near parks usually sell for higher prices. In addition, by cooling buildings in summer, trees can reduce the amount of electricity needed for air conditioning.",
      "Despite these benefits, planting trees in cities is not simple. Young trees need regular watering and care, their roots can damage pavements and pipes, and space is limited in crowded areas. For this reason, experts recommend that city authorities choose species carefully and plan for maintenance from the beginning, rather than planting trees and leaving them to survive on their own."],
    qs: [
      { q: "What is the main idea of the passage?", o: ["Trees are more important to cities than many people think", "Trees should replace roads", "Planting trees is too expensive", "Hospitals should be built in parks"], a: 0, why: "Câu cuối đoạn 1 nêu luận điểm: “not a luxury but a necessity”." },
      { q: "The word “luxury” in paragraph 1 is closest in meaning to", o: ["something necessary", "something pleasant but not essential", "something dangerous", "something cheap"], a: 1, why: "Manh mối trái nghĩa: luxury ≠ necessity." },
      { q: "According to paragraph 2, why are city centres warmer?", o: ["There are more people", "Concrete and asphalt store heat", "Trees release heat at night", "Cars produce water vapour"], a: 1, why: "“absorb heat during the day and release it at night”." },
      { q: "The word “Their” in paragraph 3 refers to", o: ["people's", "trees'", "particles'", "residents'"], a: 1, why: "Câu trước: “Trees also improve people's health”; lá là của cây." },
      { q: "Which economic benefit is NOT mentioned?", o: ["More customers for shops", "Higher house prices", "Lower electricity use", "More jobs for gardeners"], a: 3, why: "Ba ý đầu có ở đoạn 4." },
      { q: "What do experts recommend?", o: ["Stop planting trees in crowded areas", "Choose species carefully and plan maintenance", "Let trees survive on their own", "Plant only young trees"], a: 1, why: "Câu cuối bài." }
    ]},

  { id: "r2-coffee", week: 2, title: "Vietnam's coffee culture", type: "Ý chính · Mục đích", skill: "main",
    paras: ["Vietnam is now the second-largest coffee producer in the world, yet the drink arrived in the country only in the second half of the nineteenth century, when French missionaries planted the first coffee trees. For decades, coffee remained a luxury enjoyed mainly by the French and by wealthy city residents.",
      "Everything changed in the 1990s. Economic reforms allowed farmers in the Central Highlands to grow coffee for export, and production rose dramatically. Most of the beans grown were robusta, a variety that is easier to cultivate than arabica and contains almost twice as much caffeine.",
      "As production grew, so did local creativity. Because fresh milk was hard to find in a hot climate, people began mixing strong coffee with sweetened condensed milk, creating iced milk coffee. In Hanoi, a shortage of milk in the 1940s is said to have led to egg coffee, in which egg yolk is whipped with sugar until it becomes a thick, creamy foam.",
      "Today, coffee is less a drink than a way of life. Small plastic stools line the pavements from early morning, and friends spend hours chatting over a single cup. Meanwhile, modern chains attract young customers with air-conditioned spaces and free Wi-Fi, showing that the culture continues to evolve."],
    qs: [
      { q: "What is the passage mainly about?", o: ["How to make egg coffee at home", "How coffee culture in Vietnam developed over time", "Why robusta is better than arabica", "The problems faced by coffee farmers"], a: 1, why: "Các đoạn đi theo thời gian: du nhập → bùng nổ sản xuất → sáng tạo → văn hóa hôm nay. A, C quá hẹp (1 chi tiết); D không được đề cập." },
      { q: "What is the main idea of paragraph 3?", o: ["Fresh milk was cheap in Vietnam", "Local conditions led to new ways of preparing coffee", "Egg coffee was invented by the French", "Hanoi produces more coffee than other regions"], a: 1, why: "Câu chủ đề “so did local creativity”; hai ví dụ phía sau đều do thiếu sữa tươi. A trái với bài." },
      { q: "Why does the author mention robusta in paragraph 2?", o: ["To explain what kind of coffee Vietnam mainly grows", "To persuade readers to drink robusta", "To criticise farmers in the Central Highlands", "To compare Vietnamese and French tastes"], a: 0, why: "Câu cung cấp thông tin (inform/explain). Bài không có ý thuyết phục hay phê phán." },
      { q: "The author mentions plastic stools and free Wi-Fi in paragraph 4 in order to", o: ["complain about crowded pavements", "illustrate that coffee is part of daily life in both old and new ways", "compare prices in different cafés", "advertise a coffee chain"], a: 1, why: "Hai chi tiết là ví dụ (illustrate) cho “a way of life” và “continues to evolve”." },
      { q: "What is the main purpose of the passage?", o: ["To describe how coffee became an important part of Vietnamese life", "To argue that Vietnam should export less coffee", "To give instructions for growing coffee", "To warn readers about caffeine"], a: 0, why: "Bài thông tin, mô tả theo trình tự thời gian → to describe/inform." },
      { q: "The passage would most likely be found in", o: ["a cookbook", "a magazine article about food and culture", "a scientific report on caffeine", "a café's price list"], a: 1, why: "Câu hỏi ngữ cảnh: giọng trung lập, có lịch sử và đời sống, không có công thức hay số liệu khoa học." }
    ]},
  { id: "r2-sleep", week: 2, title: "Why teenagers go to bed late", type: "Suy luận · Diễn đạt lại", skill: "infer",
    paras: ["Parents often complain that their teenage children stay up late at night and are impossible to wake in the morning. It is tempting to blame mobile phones or laziness, but scientists have found that the cause is largely biological.",
      "During puberty, the body begins to release melatonin, the hormone that makes us feel sleepy, about two hours later than it did in childhood. **As a result, a fifteen-year-old who goes to bed at ten o'clock may simply lie awake, not because of a lack of discipline but because the body is not yet ready to sleep.** Teenagers still need eight to ten hours of sleep a night, so an early alarm leaves many of them seriously short of rest.",
      "This shortage has consequences. Sleep-deprived students find it harder to concentrate, remember new information and control their emotions. Some studies have also linked a lack of sleep to a higher risk of road accidents among young drivers.",
      "In response, a number of school districts in the United States have moved the start of the school day from around 7:30 to 8:30 or later. Early results are encouraging: attendance has improved, and fewer students fall asleep in class. However, the change is not always popular. Bus timetables must be reorganised, and some parents worry that a later finish will cut into after-school jobs and sports."],
    qs: [
      { q: "Which of the following best restates the highlighted sentence in paragraph 2?", o: ["Teenagers who cannot fall asleep at ten are usually undisciplined.", "A teenager may be unable to sleep early because of natural body changes, not bad habits.", "Fifteen-year-olds should go to bed at exactly ten o'clock.", "Teenagers sleep better when they stay in bed for a long time."], a: 1, why: "Giữ đủ 2 ý: không ngủ được sớm + do cơ thể chứ không do thiếu kỷ luật. A đảo ngược nghĩa; C, D thêm ý mới." },
      { q: "It can be inferred from paragraph 1 that many parents believe", o: ["their children's late nights are caused by phones or laziness", "teenagers need less sleep than adults", "melatonin is harmful", "schools should start later"], a: 0, why: "“It is tempting to blame mobile phones or laziness” → đây là cách nghĩ phổ biến." },
      { q: "What can be inferred about a teenager who must get up at 6 a.m. for school?", o: ["He or she probably gets enough sleep", "He or she is likely to be short of sleep", "He or she will be a careful driver", "He or she usually falls asleep before nine"], a: 1, why: "Cơ thể buồn ngủ muộn + cần 8–10 tiếng → dậy 6 giờ dễ thiếu ngủ. Bài không nói thẳng, phải suy ra." },
      { q: "Which sentence has the same meaning as “Early results are encouraging” in paragraph 4?", o: ["The first results suggest the change is working.", "The results will only be known much later.", "The results are worse than expected.", "Students have encouraged the change."], a: 0, why: "encouraging = đáng khích lệ. D dùng lại từ gốc (encourage) nhưng sai nghĩa – bẫy hay gặp." },
      { q: "The author implies that changing school start times", o: ["has no effect on students", "brings benefits but also practical difficulties", "is supported by every parent", "is only possible in the United States"], a: 1, why: "Đoạn 4: kết quả tốt, rồi “However…” nêu khó khăn. C dùng từ tuyệt đối (every)." },
      { q: "The tone of the passage can best be described as", o: ["mocking", "objective", "angry", "uninterested"], a: 1, why: "Trình bày nguyên nhân, hệ quả, ưu và nhược điểm, không bộc lộ cảm xúc → objective." }
    ]},
  { id: "r2-fashion", week: 2, title: "Turning waste into fashion", type: "Chèn câu · Cách tổ chức", skill: "insert",
    paras: ["Every year, the fashion industry produces around 100 billion items of clothing, and a large share of them end up in landfill within a few years. **[A]** Cheap fabrics, rapidly changing trends and low prices encourage consumers to buy more and throw away more.",
      "Some designers are now trying to break this cycle. **[B]** One Vietnamese brand, for example, collects used jeans from customers and turns them into bags and jackets. Another company in Europe makes trainers from plastic bottles collected from beaches. **[C]** Although these products are often more expensive than ordinary ones, they are attracting a growing number of young buyers who care about the environment.",
      "Recycling alone, however, cannot solve the problem. **[D]** Experts point out that the most effective solution is simply to buy fewer clothes and to keep them longer. Repairing, swapping and renting clothes are all becoming more common, especially in large cities."],
    qs: [
      { q: "Where would this sentence best fit? “Such products give a second life to materials that would otherwise be wasted.”", o: ["[A]", "[B]", "[C]", "[D]"], a: 2, why: "“Such products” cần đứng SAU các ví dụ sản phẩm (túi từ quần jeans, giày từ chai nhựa) → [C]." },
      { q: "Where would this sentence best fit? “Recycling also uses energy and water, and some materials cannot be recycled at all.”", o: ["[A]", "[B]", "[C]", "[D]"], a: 3, why: "Câu giải thích vì sao “Recycling alone… cannot solve the problem” → đứng ngay sau câu đó, ở [D]." },
      { q: "What is the main idea of the passage?", o: ["Recycled fashion products are too expensive", "Fashion creates a lot of waste, and several ways of reducing it are being tried", "Young people buy too many trainers", "Vietnam has the best recycled-fashion brands"], a: 1, why: "Bao quát cả 3 đoạn. A, C quá hẹp; D không có trong bài." },
      { q: "Why does the author mention the Vietnamese brand and the European company?", o: ["To give examples of designers who are breaking the cycle of waste", "To show which country is richer", "To criticise recycled products", "To explain how jeans are made"], a: 0, why: "Đứng sau “for example” → minh họa cho câu chủ đề đoạn 2." },
      { q: "Which of the following best describes the organization of the passage?", o: ["A problem is described, then some solutions are discussed", "Events are presented in chronological order", "Two designers are compared and contrasted", "A theory is explained and then rejected"], a: 0, why: "Đoạn 1 nêu vấn đề; đoạn 2–3 nêu giải pháp (tái chế, mua ít hơn) → problem–solution." },
      { q: "What would the paragraph following the passage most likely discuss?", o: ["The history of jeans", "Examples of services for repairing, swapping or renting clothes", "How plastic bottles are made", "The price of cotton in Asia"], a: 1, why: "Câu cuối nhắc repairing, swapping, renting → đoạn sau thường triển khai tiếp ý này." }
    ]},
  { id: "r2-bamboo", week: 2, title: "Bamboo: the “green steel”", type: "Tổng hợp tuần 2 · mức B2", skill: "mixed",
    paras: ["Bamboo has been used in Asia for thousands of years to build houses, bridges and furniture. In recent decades, engineers and architects in other parts of the world have started to take a serious interest in it, and some now call it “green steel”.",
      "The nickname reflects two of bamboo's most remarkable qualities. First, it is extremely strong for its weight: certain species can resist being pulled apart about as well as some types of steel. **[A]** Second, it grows **astonishingly** fast. Some varieties can grow almost a metre in a single day, and a plant can be harvested after three to five years, compared with several decades for most trees. **[B]**",
      "Bamboo also offers environmental advantages. **Because it spreads through underground roots, it does not need to be replanted after it is cut, and the same plant can keep producing new stems for many years.** **[C]** Its dense root system also helps to hold soil in place, which reduces the risk of landslides on hillsides.",
      "Nevertheless, bamboo is not a perfect material. Untreated bamboo can be attacked by insects and fungi, and it may rot if it stays wet. **[D]** In addition, because every stem is slightly different in size and shape, it is harder to produce standard parts than with steel or concrete. Researchers are therefore developing new treatments and processing methods that could make bamboo more durable and more predictable.",
      "If these efforts succeed, bamboo could become a common sight not only in rural villages but also in modern cities, helping the construction industry to reduce its large carbon footprint."],
    qs: [
      { q: "What does the passage mainly discuss?", o: ["The history of bamboo houses in Asia", "The strengths and weaknesses of bamboo as a building material", "How steel is produced", "Why insects attack plants"], a: 1, why: "Đoạn 2–3: ưu điểm; đoạn 4: nhược điểm; đoạn 5: triển vọng." },
      { q: "The word “astonishingly” in paragraph 2 is closest in meaning to", o: ["surprisingly", "slightly", "dangerously", "rarely"], a: 0, why: "Ví dụ phía sau (gần 1 mét/ngày) cho thấy mức độ đáng kinh ngạc." },
      { q: "Which of the following best restates the highlighted sentence in paragraph 3?", o: ["Bamboo must be replanted every time it is harvested.", "Since bamboo grows from its roots, one plant can be cut many times without replanting.", "Bamboo roots are dangerous for other plants.", "Bamboo stems only grow for a few years."], a: 1, why: "Giữ quan hệ nguyên nhân (Because → Since) và đủ ý. A trái nghĩa; C, D không có trong câu." },
      { q: "Where would this sentence best fit? “For this reason, it must be carefully dried and protected before use.”", o: ["[A]", "[B]", "[C]", "[D]"], a: 3, why: "“For this reason” chỉ nguyên nhân ngay trước: côn trùng, nấm, mục khi ẩm → [D]." },
      { q: "It can be inferred from paragraph 4 that builders may prefer steel or concrete because these materials", o: ["are cheaper to grow", "can be made in more uniform sizes", "look more natural", "hold soil in place"], a: 1, why: "Tre mỗi cây một khác → khó làm chi tiết chuẩn; suy ra thép, bê tông đồng đều hơn." },
      { q: "Why does the author compare bamboo with most trees in paragraph 2?", o: ["To emphasise how quickly bamboo can be harvested", "To show that trees are stronger", "To argue that people should stop planting trees", "To describe the shape of bamboo stems"], a: 0, why: "3–5 năm so với vài chục năm → nhấn mạnh (emphasise) tốc độ." },
      { q: "The author's attitude towards bamboo can best be described as", o: ["strongly critical", "cautiously positive", "completely indifferent", "angry"], a: 1, why: "Nhiều ưu điểm, có thừa nhận nhược điểm (Nevertheless…), kết bằng “If these efforts succeed…” → tích cực nhưng thận trọng." },
      { q: "The passage would most likely appear in", o: ["a popular science magazine", "a novel", "a restaurant review", "a personal diary"], a: 0, why: "Thông tin khoa học, giọng trung lập, dễ hiểu cho người đọc phổ thông." }
    ]}
];

const READ_TIPS = [
  { t: "Câu hỏi từ vựng", d: "Dạng “closest in meaning to / could be replaced by”. Đọc câu chứa từ cùng 1–2 câu trước và sau. Tìm manh mối: đồng nghĩa (or, that is), trái nghĩa (but, however, unlike), ví dụ (such as, like), định nghĩa (is, means, dấu hai chấm). Thay từng đáp án vào câu xem có hợp nghĩa không." },
  { t: "Câu hỏi tham chiếu", d: "Dạng “The word … refers to”. Đọc câu chứa từ và câu liền trước. Khớp số ít/số nhiều (it/they, this/these) và người/vật (he/she với it). Thay đáp án vào chỗ đại từ để kiểm tra." },
  { t: "Câu hỏi chi tiết", d: "Gạch từ khóa trong câu hỏi (tên, số liệu, thời gian), scan tìm trong bài, rồi đọc kỹ câu đó. Cẩn thận bẫy paraphrase và từ tuyệt đối (all, always, never). Với NOT/EXCEPT: tìm 3 ý có trong bài rồi loại trừ." },
  { t: "Skimming và scanning", d: "Skimming là đọc lướt câu đầu/cuối mỗi đoạn để nắm ý chính, dùng cho câu hỏi main idea. Scanning là quét nhanh tìm từ khóa, số, tên riêng, dùng cho câu hỏi chi tiết và Đúng/Sai." },
  { week: 2, t: "Câu hỏi ý chính", d: "“What is the main idea / mainly discuss…?” Skim câu đầu và câu cuối mỗi đoạn, đoạn đầu và đoạn cuối bài, để ý từ được lặp lại. Loại đáp án quá rộng, quá hẹp (chỉ 1 ví dụ), đúng nhưng không phải trọng tâm, hoặc không có trong bài." },
  { week: 2, t: "Câu hỏi mục đích", d: "“Why does the author mention…? / The purpose of the passage is…” Nhận diện động từ mục đích: explain, describe, illustrate, compare, persuade, argue, emphasise, criticise. Bài có định nghĩa, số liệu → inform/describe; có ví dụ → illustrate; có ý kiến và lập luận → persuade/argue." },
  { week: 2, t: "Câu hỏi suy luận", d: "“It can be inferred / The author implies…” Làm sau cùng. Quay lại đoạn liên quan, đọc thêm 1–2 câu xung quanh, tự rút kết luận trước khi xem đáp án. Loại đáp án tuyệt đối (always, never, every) và đáp án chỉ giống từ nhưng sai ý." },
  { week: 2, t: "Câu hỏi diễn đạt lại", d: "“Which best restates the highlighted sentence?” Chọn câu giữ 100% ý, đúng quan hệ logic (nguyên nhân – kết quả, đối lập). Loại câu thêm ý, thiếu ý, đảo quan hệ, dùng lại nhiều từ gốc nhưng sai nghĩa, hoặc đổi mức độ (may → must)." },
  { week: 2, t: "Câu hỏi chèn câu", d: "Đọc câu cần chèn trước, tìm dấu hiệu: this/these/such → sau câu nói về đối tượng đó; however → giữa hai ý đối lập; for example → sau ý khái quát; therefore/as a result/for this reason → sau nguyên nhân; also/another → sau ý cùng loại." },
  { week: 2, t: "Các dạng khác", d: "Ngữ cảnh (bài in ở đâu, ai viết): nhìn chủ đề và thuật ngữ. Giọng điệu, thái độ: tìm tính từ, trạng từ đánh giá; bài học thuật thường objective. Đoạn trước/sau: xem câu đầu/câu cuối. Cách tổ chức: nhìn từ nối (problem–solution, cause–effect, chronological, compare–contrast)." }
];

  function inRange() { const [a, b] = getRange(); return VOCAB[deck].slice(a - 1, b); }
  function setRange(a, b) {
    const n = VOCAB[deck].length;
    a = Math.min(Math.max(1, a | 0), n); b = Math.min(Math.max(1, b | 0), n);
    if (a > b) [a, b] = [b, a];
    S.ranges = S.ranges || {};
    if (a === 1 && b === n) delete S.ranges[deck]; else S.ranges[deck] = [a, b];
    save(); reorder(true); drawRange(); draw();
  }
  function drawRange() {
    const all = VOCAB[deck], n = all.length, [a, b] = getRange(), size = S.groupSize || 15;
    const isAll = a === 1 && b === n;
    const groups = [];
    for (let s = 1; s <= n; s += size) groups.push([s, Math.min(n, s + size - 1)]);
    const chip = (label, ga, gb, on) => el("button", { class: "chip", "aria-pressed": String(on), text: label, onclick: () => setRange(ga, gb) });
    const sizeSel = el("select", { id: "grp-size", "aria-label": "Số từ mỗi nhóm", onchange: e => { S.groupSize = parseInt(e.target.value, 10); save(); drawRange(); } },
      [10, 15, 20, 30].map(v => el("option", { value: String(v), text: `${v} từ/nhóm`, selected: v === size })));
    const from = el("input", { type: "number", id: "rg-from", min: "1", max: String(n), value: String(a), style: "width:72px", "aria-label": "Từ số" });
    const to = el("input", { type: "number", id: "rg-to", min: "1", max: String(n), value: String(b), style: "width:72px", "aria-label": "Đến số" });
    rangeBar.replaceChildren(
      el("div", { class: "row between" }, el("b", { text: "Học theo nhóm" }), sizeSel),
      el("div", { class: "row" }, chip(`Tất cả (${n})`, 1, n, isAll), groups.map(([ga, gb]) => {
        const done = all.slice(ga - 1, gb).every(w => S.known[w[0]]);
        return chip(`${ga}–${gb}${done ? " ✓" : ""}`, ga, gb, !isAll && a === ga && b === gb);
      })),
      el("div", { class: "row small" }, "Hoặc tự chọn: từ số", from, "đến số", to, el("button", { class: "btn", text: "Áp dụng", onclick: () => setRange(+from.value, +to.value) })),
      el("p", { class: "small muted", text: isAll ? "Đang học cả bộ. Chọn một nhóm để học ít từ hơn mỗi ngày; nhóm có dấu ✓ là đã thuộc hết." : `Đang học từ số ${a} đến ${b} (${b - a + 1} từ). Thẻ đã được trộn; bấm “Trộn thẻ” để trộn lại.` }));
  }
  function cards() { const all = inRange(); return onlyNew ? all.filter(w => !S.known[w[0]]) : all; }
  function reorder(sh) { const c = cards(); order = sh ? shuffle(c.map((_, k) => k)) : c.map((_, k) => k); i = 0; flipped = false; }
  function drawChips() {
    deckChips.replaceChildren(...decks.map(d => el("button", { class: "chip", "aria-pressed": String(d === deck), text: `${d} (${VOCAB[d].length})`, onclick: () => { deck = d; reorder(!!(S.ranges || {})[d]); drawChips(); drawRange(); draw(); } })));
    modeChips.replaceChildren(
      ...[["the", "Thẻ ghi nhớ"], ["quiz", "Trắc nghiệm 10 câu"], ["go", "Gõ từ tiếng Anh"], ["list", "Danh sách"]].map(([m, t]) => el("button", { class: "chip", "aria-pressed": String(m === mode), text: t, onclick: () => { mode = m; drawChips(); draw(); } })),
      el("label", { class: "row small", for: "only-new", style: "margin-left:8px" }, el("input", { type: "checkbox", id: "only-new", checked: onlyNew, onchange: e => { onlyNew = e.target.checked; reorder(false); draw(); } }), "Chỉ từ chưa thuộc"));
  }
  function drawCard() {
    PRON.abort();
    const c = cards();
    if (!c.length) { body.replaceChildren(el("div", { class: "card" }, el("p", { text: "Bạn đã thuộc hết bộ này. Bỏ chọn “Chỉ từ chưa thuộc” để ôn lại." }))); return; }
    if (i >= order.length) i = 0;
    const w = c[order[i]];
    const known = !!S.known[w[0]];
    const card = el("div", { class: "card flash" + (known ? " known" : ""), tabindex: "0", role: "button", "aria-label": "Lật thẻ", onclick: () => { flipped = !flipped; drawCard(); }, onkeydown: e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipped = !flipped; drawCard(); } } },
      el("span", { class: "hint", text: `Từ số ${VOCAB[deck].indexOf(w) + 1}` }),
      el("span", { class: "w", text: w[0] }),
      flipped ? el("span", { class: "m", text: w[1] }) : el("span", { class: "hint", text: "Bấm để xem nghĩa" }),
      known ? el("span", { class: "tag ok", text: "Đã thuộc" }) : null);
    const markK = v => { if (v) S.known[w[0]] = 1; else delete S.known[w[0]]; save(); markDay(); drawRange(); next(); };
    const next = () => { if (onlyNew) { order = cards().map((_, k) => k); if (i >= order.length) i = 0; } else i = (i + 1) % order.length; flipped = false; drawCard(); };
    body.replaceChildren(card,
      el("div", { class: "row between" },
        el("div", { class: "row" }, el("button", { class: "btn", text: "←", "aria-label": "Thẻ trước", onclick: () => { i = (i - 1 + order.length) % order.length; flipped = false; drawCard(); } }),
          el("span", { class: "prog", text: `${i + 1}/${order.length}` }),
          el("button", { class: "btn", text: "→", "aria-label": "Thẻ sau", onclick: next })),
        el("div", { class: "row" }, el("button", { class: "btn", text: "Nghe phát âm", onclick: e => { e.stopPropagation(); TTS.speak(w[0].replace(/\(.*?\)/g, "")); } }),
          el("button", { class: "btn", text: "Trộn thẻ", onclick: () => { reorder(true); drawCard(); } }))),
      el("div", { class: "row" }, el("button", { class: "btn", text: "Chưa thuộc", onclick: () => markK(false) }), el("button", { class: "btn primary", text: "Đã thuộc", onclick: () => markK(true) })),
      el("p", { class: "prog", text: `Đã thuộc ${inRange().filter(x => S.known[x[0]]).length}/${inRange().length} từ trong nhóm này` }),
      pronBox(w[0]));
  }
  function drawQuiz() {
    const pool = inRange();
    const distract = pool.length >= 4 ? pool : VOCAB[deck]; // tiny ranges borrow wrong answers from the whole deck
    const qs = shuffle(pool).slice(0, Math.min(10, pool.length));
    let score = 0, done = 0;
    const wrap = el("div", { class: "card stack" });
    const tally = el("p", { class: "prog" });
    const upd = () => tally.textContent = `Đúng ${score}/${done} · ${qs.length - done} câu còn lại`;
    qs.forEach((w, qi) => {
      const opts = shuffle([w, ...shuffle(distract.filter(x => x !== w)).slice(0, 3)]);
      const fb = el("span", { class: "small" });
      const btns = opts.map((o, k) => el("button", { class: "opt", type: "button", onclick: () => {
        if (btns[0].disabled) return; done++;
        const ok = o === w; if (ok) { score++; S.known[w[0]] = 1; save(); }
        btns.forEach((b, j) => { b.disabled = true; if (opts[j] === w) b.classList.add("correct"); else if (j === k) b.classList.add("wrong"); if (j === k) b.classList.add("picked"); });
        upd(); markDay();
      } }, el("span", { class: "L", text: LETTERS[k] }), el("span", { text: o[1] })));
      wrap.append(el("div", { class: "q" }, el("div", { class: "row between" }, el("span", { class: "qt", text: `${qi + 1}. ${w[0]}` }), el("button", { class: "btn speak-btn", text: "Nghe", onclick: () => TTS.speak(w[0].replace(/\(.*?\)/g, "")) })), el("div", { class: "opts" }, btns), fb));
    });
    upd();
    body.replaceChildren(el("div", { class: "row between" }, tally, el("button", { class: "btn", text: "Đề khác", onclick: drawQuiz })), wrap);
  }
  function drawList() {
    body.replaceChildren(el("div", { class: "card" }, el("div", { class: "wordlist" }, inRange().map(w => el("div", { class: S.known[w[0]] ? "k" : "" }, el("span", { class: "muted num", text: `${VOCAB[deck].indexOf(w) + 1}. ` }), el("b", { text: w[0] }), " – ", w[1])))));
  }
  function drawType() {
    // Vietnamese meaning → type the English word; grammar labels like "(v)" are not required
    const norm = s => s.toLowerCase().replace(/\(.*?\)/g, "").replace(/[’`]/g, "'").replace(/\s+/g, " ").trim();
    const items = shuffle(inRange());
    let score = 0, done = 0;
    const tally = el("p", { class: "prog" });
    const upd = () => tally.textContent = `Đúng ${score}/${items.length} · đã làm ${done}/${items.length}`;
    const wrap = el("div", { class: "card stack" });
    items.forEach((w, qi) => {
      const inp = el("input", { type: "text", id: `go-${qi}`, autocomplete: "off", autocapitalize: "off", spellcheck: "false", "aria-label": `Từ tiếng Anh cho: ${w[1]}` });
      const mark = el("span", { style: "font-weight:800;font-size:1.15rem;min-width:1.2em" });
      const fb = el("span", { class: "small" });
      let finished = false, tries = 0;
      const finish = ok => {
        finished = true; done++; if (ok) { score++; S.known[w[0]] = 1; save(); }
        inp.disabled = true; markDay(); upd();
      };
      const check = () => {
        if (finished || !inp.value.trim()) return;
        tries++;
        if (norm(inp.value) === norm(w[0])) {
          mark.textContent = "✓"; mark.style.color = "var(--ok)"; inp.style.borderColor = "var(--ok)";
          fb.textContent = tries > 1 ? "Đúng (sau khi sửa)" : ""; finish(tries === 1);
        } else {
          mark.textContent = "✗"; mark.style.color = "var(--bad)"; inp.style.borderColor = "var(--bad)";
          fb.textContent = "Chưa đúng, thử lại hoặc bấm Gợi ý"; fb.style.color = "var(--bad)";
          inp.select();
        }
      };
      inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
      const hint = el("button", { class: "btn ghost", text: "Gợi ý", onclick: () => {
        if (finished) return;
        const ans = w[0].replace(/\(.*?\)/g, "").trim();
        fb.style.color = ""; fb.textContent = `Bắt đầu bằng “${ans.slice(0, Math.min(ans.length, 1 + tries))}…”, ${ans.length} ký tự`; tries++;
      } });
      const reveal = el("button", { class: "btn ghost", text: "Xem đáp án", onclick: () => {
        if (finished) return;
        inp.value = w[0]; mark.textContent = "✗"; mark.style.color = "var(--bad)"; fb.style.color = ""; fb.textContent = "Ghi nhớ từ này rồi làm lại lượt sau"; finish(false);
      } });
      wrap.append(el("div", { class: "gq" },
        el("div", { class: "row between" }, el("span", { class: "qt", text: `${qi + 1}. ${w[1]}` }), el("span", { class: "small muted", text: `Từ số ${VOCAB[deck].indexOf(w) + 1}` })),
        el("div", { class: "row" }, inp, mark, el("button", { class: "btn", text: "Kiểm tra", onclick: check }), hint, reveal),
        fb));
    });
    upd();
    body.replaceChildren(el("div", { class: "row between" }, tally, el("button", { class: "btn", text: "Trộn lại, làm lượt mới", onclick: drawType })),
      el("p", { class: "small muted", text: "Gõ xong bấm Enter. Không cần gõ phần trong ngoặc như (v), (adj). Đúng ngay lần đầu thì từ được tính là đã thuộc." }), wrap);
  }
  function draw() { mode === "the" ? drawCard() : mode === "quiz" ? drawQuiz() : mode === "go" ? drawType() : drawList(); }
  reorder(!!(S.ranges || {})[deck]); drawChips(); drawRange(); draw();
};

/* ---------------- Ngữ pháp ---------------- */
RENDER["ngu-phap"] = function () {
  const root = $("#v-ngu-phap"); root.replaceChildren();
  root.append(el("div", { class: "sec-head" }, el("h2", { text: "Ngữ pháp nền cho Viết" }),
    el("p", { class: "lede", text: "Bốn nhóm này bám theo phần ôn tập chương 1 trong file Writing tuần 1: cấu trúc câu, thì, động từ khuyết thiếu, liên từ và từ nối. Câu đúng được lưu vào tiến độ." })));
  const norm = s => s.toLowerCase().replace(/[’`]/g, "'").replace(/\s+/g, " ").trim();
  GRAMMAR.forEach((g, gi) => {
    const card = el("div", { class: "card stack" }, el("h3", { text: g.name }), el("p", { class: "note", text: g.note }));
    g.items.forEach((it, ii) => {
      const k = `${gi}-${ii}`;
      const fb = el("span", { class: "small" });
      const setFb = ok => { fb.textContent = ok ? "Đúng" : "Sai"; fb.style.color = ok ? "var(--ok)" : "var(--bad)"; };
      let ctrl;
      if (g.type === "mcq") {
        const btns = it[1].map((o, j) => el("button", { class: "opt", type: "button", onclick: () => {
          const ok = j === it[2]; S.gram[k] = ok; save(); markDay();
          btns.forEach((b, x) => { b.classList.remove("correct", "wrong", "picked"); if (x === j) b.classList.add(ok ? "correct" : "wrong", "picked"); });
          setFb(ok); if (!ok) fb.textContent = "Sai, thử lại";
        } }, el("span", { text: o })));
        ctrl = el("div", { class: "opts" }, btns, fb);
      } else {
        const inp = el("input", { type: "text", id: `g-${k}`, autocomplete: "off", spellcheck: "false", "aria-label": "Đáp án" });
        const check = () => { const ok = it[1].some(a => norm(a) === norm(inp.value)); S.gram[k] = ok; save(); markDay(); setFb(ok); if (!ok) fb.textContent = `Sai · đáp án: ${it[1][0]}`; };
        inp.addEventListener("keydown", e => { if (e.key === "Enter") check(); });
        ctrl = el("div", { class: "row" }, inp, el("button", { class: "btn", text: "Kiểm tra", onclick: check }), fb);
      }
      card.append(el("div", { class: "gq" }, el("span", { text: `${ii + 1}. ${it[0]}` }), ctrl));
    });
    root.append(card);
  });
};

show(VIEWS.includes(start) ? start : "tong-quan");
