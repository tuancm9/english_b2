<meta charset="utf-8">
<title>Phòng luyện VSTEP B2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Literata:opsz,wght@7..72,400;7..72,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: sticky skill-tab rail over one 980px workbench column; exam-paper surfaces; correct answers get a teacher's marker circle */
:root{
  --paper:#F3F3EE; --surface:#FFFFFF; --sunk:#EBECE5; --ink:#172036; --muted:#596178; --line:#D9DAD1;
  --navy:#22407F; --navy-soft:#E5EBF7; --accent:#D2621A; --accent-soft:#FBE8D9;
  --ok:#1C7A4B; --ok-soft:#DDF1E5; --bad:#B3261E; --bad-soft:#FBE4E1; --warn:#9A6400; --warn-soft:#FBF0D6;
  --f-ui:"Be Vietnam Pro", system-ui, "Segoe UI", Roboto, sans-serif;
  --f-read:"Literata", Georgia, "Times New Roman", serif;
  --f-mono:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#11151D; --surface:#1A1F2A; --sunk:#151A23; --ink:#E7E9EF; --muted:#A0A7B7; --line:#2C3443;
  --navy:#93B1F5; --navy-soft:#1E2943; --accent:#F08C48; --accent-soft:#3A2819;
  --ok:#62C792; --ok-soft:#16301F; --bad:#F2887D; --bad-soft:#3A1D1A; --warn:#E8B85A; --warn-soft:#33290F;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#11151D; --surface:#1A1F2A; --sunk:#151A23; --ink:#E7E9EF; --muted:#A0A7B7; --line:#2C3443;
  --navy:#93B1F5; --navy-soft:#1E2943; --accent:#F08C48; --accent-soft:#3A2819;
  --ok:#62C792; --ok-soft:#16301F; --bad:#F2887D; --bad-soft:#3A1D1A; --warn:#E8B85A; --warn-soft:#33290F;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important} /* also when the file is opened directly, outside the artifact skeleton */
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{text-wrap:balance;margin:0;line-height:1.25}
h2{font-size:1.45rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:700}
h4{font-size:.95rem;font-weight:700}
p{margin:0}
a{color:var(--navy)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header + tabs */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px;padding-block:14px 10px}
.brand{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.brand h1{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.brand .lvl{font-family:var(--f-mono);font-weight:600;font-size:.8rem;color:var(--accent);border:1.5px solid var(--accent);border-radius:999px;padding:1px 8px;transform:rotate(-3deg);display:inline-block}
.top .src{font-size:.8rem;color:var(--muted)}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs button{flex:none;background:none;border:0;padding:11px 12px 9px;font-weight:600;font-size:.92rem;color:var(--muted);border-bottom:2.5px solid transparent;cursor:pointer;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button:hover{color:var(--ink)}
main{padding-block:22px 64px}
.view{display:flex;flex-direction:column;gap:18px}

/* shared */
.sec-head{display:flex;flex-direction:column;gap:6px}
.lede{color:var(--muted);max-width:68ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card.flat{background:transparent;border-style:dashed}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.grid2>*,.grid3>*{min-width:0}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{border-color:var(--navy)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--navy)}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tag{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:4px;background:var(--navy-soft);color:var(--navy)}
.tag.ctu{background:var(--accent-soft);color:var(--accent)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=text],input[type=date],input[type=number],textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
textarea{width:100%;resize:vertical;line-height:1.6}
details>summary{cursor:pointer;font-weight:600;color:var(--navy)}
details[open]>summary{margin-bottom:8px}
ul.clean{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.note{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.88rem}
.note b{color:var(--warn)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* score scale */
.scale{position:relative;height:38px;margin-top:6px}
.scale .bar{position:absolute;inset:12px 0 auto;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--sunk) 0 40%,var(--navy-soft) 40% 60%,var(--accent-soft) 60% 85%,var(--ok-soft) 85% 100%);border:1px solid var(--line)}
.scale .tick{position:absolute;top:0;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);transform:translateX(-50%)}
.scale .tick::after{content:"";display:block;width:1px;height:26px;background:var(--line);margin:2px auto 0}
.scale .lab{position:absolute;bottom:-4px;font-size:.72rem;font-weight:700;transform:translateX(-50%)}
.target-line{position:absolute;top:6px;height:22px;width:2px;background:var(--accent);left:60%}

/* stats */
.stat{display:flex;flex-direction:column;gap:2px}
.stat .v{font-family:var(--f-mono);font-size:1.4rem;font-weight:600;font-variant-numeric:tabular-nums}
.stat .k{font-size:.82rem;color:var(--muted)}
.meter{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--navy)}

/* options with marker circle */
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
.opt:hover{border-color:var(--navy)}
.opt .L{flex:none;width:24px;height:24px;display:grid;place-items:center;font-weight:700;font-size:.85rem;border-radius:50%}
.opt.sel{border-color:var(--navy);background:var(--navy-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}
.opt.correct .L{box-shadow:0 0 0 2px var(--accent);transform:rotate(-8deg) scale(1.1);color:var(--accent)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.opt.picked::after{margin-left:auto;padding-left:10px;font-weight:800;font-size:1.05rem;line-height:24px}
.opt.correct.picked::after{content:"✓";color:var(--ok)}
.opt.wrong.picked::after{content:"✗";color:var(--bad)}
.fb{font-size:.88rem;padding:8px 10px;border-radius:8px}
.fb.ok{background:var(--ok-soft);color:var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--bad)}
.fb.info{background:var(--navy-soft);color:var(--ink)}

/* listening */
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dot{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-weight:600;cursor:pointer}
.dot[aria-current="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.dot.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.player{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.wave{display:inline-flex;gap:3px;align-items:flex-end;height:18px}
.wave i{width:3px;background:var(--navy);border-radius:2px;height:4px}
.wave.on i{animation:w 0.9s ease-in-out infinite}
.wave.on i:nth-child(2){animation-delay:.15s}.wave.on i:nth-child(3){animation-delay:.3s}.wave.on i:nth-child(4){animation-delay:.45s}
@keyframes w{0%,100%{height:4px}50%{height:18px}}
@media (prefers-reduced-motion:reduce){.wave.on i{animation:none;height:12px}}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.bank span{font-size:.85rem;padding:2px 9px;border:1px dashed var(--line);border-radius:6px;background:var(--surface)}
.gap-text{font-family:var(--f-read);font-size:1.02rem;line-height:2.1}
.gap-text select{font-family:var(--f-ui);font-size:.88rem;padding:2px 6px;margin:0 2px;max-width:100%}
.gap-text select.ok{border-color:var(--ok);background:var(--ok-soft)}
.gap-text select.bad{border-color:var(--bad);background:var(--bad-soft)}
.transcript{font-family:var(--f-read);line-height:1.8;background:var(--sunk);border-radius:8px;padding:12px 14px}
.transcript b{color:var(--accent);text-decoration:underline;text-underline-offset:3px}

/* reading */
.plist{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.pitem{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.pitem:hover{border-color:var(--navy)}
.pitem .best{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.read-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.read-grid{grid-template-columns:1fr}}
.passage{font-family:var(--f-read);font-size:1.02rem;line-height:1.75;display:flex;flex-direction:column;gap:12px}
.passage b{background:var(--accent-soft);padding:0 2px;border-radius:2px}
@media (min-width:821px){.passage-card{position:sticky;top:60px;max-height:calc(100vh - 80px);overflow:auto}}
.q{display:flex;flex-direction:column;gap:8px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.q:last-child{border-bottom:0}
.q .qt{font-weight:600}
.why{font-size:.86rem;color:var(--muted);border-left:3px solid var(--accent);padding-left:10px}

/* writing */
.subtabs{display:flex;flex-wrap:wrap;gap:6px}
.editor-bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;font-size:.88rem}
.wc{font-family:var(--f-mono);font-weight:600}
.wc.low{color:var(--bad)} .wc.good{color:var(--ok)}
.clock{font-family:var(--f-mono);font-weight:600;font-size:1.05rem;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:6px;background:var(--sunk)}
.clock.low{color:var(--warn);background:var(--warn-soft)}
.clock.done{color:var(--bad);background:var(--bad-soft)}
.prompt{font-family:var(--f-read);font-size:1.02rem;line-height:1.7;background:var(--sunk);border-left:3px solid var(--navy);border-radius:0 8px 8px 0;padding:12px 14px}
.tmpl{font-family:var(--f-mono);font-size:.84rem;line-height:1.7;white-space:pre-wrap;background:var(--sunk);border-radius:8px;padding:12px}
.cls-item{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.cls-item:last-child{border-bottom:0}
.cls-item .txt{flex:1 1 260px;min-width:0}

/* AI result */
.ai-box{display:none}
body.has-ai .ai-box{display:block}
.ai-off{display:none}
body.no-ai .ai-off{display:block}
.grade-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.grade-score{font-family:var(--f-mono);font-size:2.2rem;font-weight:600;line-height:1}
.crit{display:grid;grid-template-columns:minmax(0,150px) 44px minmax(0,1fr);gap:4px 12px;align-items:start;font-size:.9rem;padding:6px 0;border-bottom:1px solid var(--line)}
.crit .s{font-family:var(--f-mono);font-weight:600}
@media (max-width:560px){.crit{grid-template-columns:1fr 44px}.crit .c{grid-column:1/-1}}
.err-row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.err-row .o{text-decoration:line-through;color:var(--bad)}
.err-row .f{color:var(--ok);font-weight:600}
.improved{font-family:var(--f-read);white-space:pre-wrap;line-height:1.7;background:var(--sunk);border-radius:8px;padding:12px}

/* speaking */
.mind{display:grid;grid-template-columns:1fr auto 1fr;grid-template-rows:auto auto auto;gap:10px;align-items:center;justify-items:center;padding:8px 0}
.mind .center{grid-column:2;grid-row:2;background:var(--navy);color:var(--surface);border-radius:12px;padding:12px 16px;font-weight:700;text-align:center;max-width:260px}
.mind .n{border:1.5px solid var(--navy);border-radius:999px;padding:6px 14px;font-size:.88rem;text-align:center;background:var(--surface);max-width:220px}
.mind .n.you{border-style:dashed;color:var(--muted)}
.mind .n1{grid-column:1/4;grid-row:1}.mind .n2{grid-column:1;grid-row:2}.mind .n3{grid-column:3;grid-row:2}.mind .n4{grid-column:1/4;grid-row:3}
@media (max-width:560px){.mind{grid-template-columns:1fr}.mind .center,.mind .n1,.mind .n2,.mind .n3,.mind .n4{grid-column:1;grid-row:auto}}
.ql{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.ql li{display:flex;gap:8px;align-items:flex-start}
.ql li .t{flex:1;min-width:0}
.speak-btn{flex:none;padding:3px 9px;font-size:.8rem}
.phase{font-weight:700;font-size:.85rem}

/* vocab */
.flash{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;user-select:none}
.flash .w{font-family:var(--f-read);font-size:2rem;font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.flash .m{font-size:1.15rem;color:var(--navy);font-weight:600}
.flash .hint{font-size:.8rem;color:var(--muted)}
.flash.known{box-shadow:inset 0 0 0 2px var(--ok)}
.prog{font-family:var(--f-mono);font-size:.85rem;color:var(--muted)}
.wordlist{columns:2 240px;column-gap:24px;font-size:.88rem}
.wordlist div{break-inside:avoid;padding:3px 0;border-bottom:1px dotted var(--line)}
.wordlist div.k{color:var(--muted)}
.wordlist b{font-weight:600}
.pron{gap:8px;padding:12px 14px}
.rec-btn.on{background:var(--bad);border-color:var(--bad);animation:recpulse 1.2s ease-in-out infinite}
@keyframes recpulse{50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){.rec-btn.on{animation:none}}
.pron-msg{margin:0;padding:8px 10px;border-radius:8px;background:var(--sunk)}
.pron-msg.ok{color:var(--ok);background:var(--ok-soft)}
.pron-msg.warn{color:var(--warn);background:var(--warn-soft)}
.pron-msg.bad{color:var(--bad);background:var(--bad-soft)}

/* grammar */
.gq{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.gq:last-child{border-bottom:0}
.gq .opts{flex-direction:row;flex-wrap:wrap}
.gq .opt{width:auto;padding:5px 12px}
.gq input[type=text]{min-width:0;flex:1 1 180px}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Phòng luyện VSTEP</h1><span class="lvl">B2 · 6.0+</span></div>
    <p class="src">Bám theo giáo trình tuần 1, Trung tâm Ngoại ngữ ĐH Cần Thơ · bài luyện do Claude soạn</p>
  </div>
</header>
<nav class="tabs" aria-label="Kỹ năng">
  <div class="wrap" role="tablist">
    <button data-v="tong-quan" role="tab">Tổng quan</button>
    <button data-v="nghe" role="tab">Nghe</button>
    <button data-v="doc" role="tab">Đọc</button>
    <button data-v="viet" role="tab">Viết</button>
    <button data-v="noi" role="tab">Nói</button>
    <button data-v="tu-vung" role="tab">Từ vựng</button>
    <button data-v="ngu-phap" role="tab">Ngữ pháp</button>
  </div>
</nav>
<main class="wrap">
  <section class="view" id="v-tong-quan"></section>
  <section class="view" id="v-nghe" hidden></section>
  <section class="view" id="v-doc" hidden></section>
  <section class="view" id="v-viet" hidden></section>
  <section class="view" id="v-noi" hidden></section>
  <section class="view" id="v-tu-vung" hidden></section>
  <section class="view" id="v-ngu-phap" hidden></section>
</main>

<script>
/* ---------------- helpers ---------------- */
const $ = (s, r = document) => r.querySelector(s);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") e.className = v;
    else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? "" : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const LETTERS = ["A", "B", "C", "D", "E"];
const words = t => (t.trim().match(/\S+/g) || []).length;
function rich(s, tag = "p") { // **bold** markup
  const p = el(tag);
  s.split("**").forEach((part, i) => { if (part) p.append(i % 2 ? el("b", { text: part }) : document.createTextNode(part)); });
  return p;
}

/* ---------------- storage (per-viewer convenience) ---------------- */
const STORE_KEY = "vstep-b2-v1";
let S = { listen: {}, read: {}, known: {}, drafts: {}, gram: {}, days: [], examDate: "" };
try { const raw = localStorage.getItem(STORE_KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function markDay() { const d = new Date().toISOString().slice(0, 10); if (!S.days.includes(d)) { S.days.push(d); save(); } }

/* ---------------- text to speech ---------------- */
const TTS = {
  voice: null, rate: 0.95,
  ok() { return "speechSynthesis" in window; },
  init() {
    if (!this.ok()) return;
    const pick = () => {
      const vs = speechSynthesis.getVoices();
      this.voice = vs.find(v => /en-US/i.test(v.lang) && /Natural|Google|Microsoft/i.test(v.name)) || vs.find(v => /^en[-_]/i.test(v.lang)) || null;
    };
    pick(); speechSynthesis.onvoiceschanged = pick;
  },
  speak(text, onend) {
    if (!this.ok()) { onend && onend(); return false; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);

const PRON = {

  stopCur: null,

  lev(a, b) {

    for (let i = 1; i <= a.length; i++) {
      let prev = d[0]; d[0] = i;
      for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1)); prev = t; }

  sim(a, b) { const m = Math.max(a.length, b.length); return m ? 1 - this.lev(a, b) / m : 1; },

/* ---------------- timer ---------------- */
function Timer() {
  const d = el("span", { class: "clock", text: "--:--" });
  let id = null, left = 0, onDone = null;
  const fmt = s => (s < 0 ? "+" : "") + String(Math.floor(Math.abs(s) / 60)).padStart(2, "0") + ":" + String(Math.abs(s) % 60).padStart(2, "0");
  function tick() {
    left--; d.textContent = fmt(left);
    d.classList.toggle("low", left <= 30 && left > 0);
    if (left === 0) { d.classList.add("done"); const f = onDone; onDone = null; f && f(); }
  }
  return {
    el: d,
    start(sec, cb) { clearInterval(id); left = sec; onDone = cb; d.classList.remove("done", "low"); d.textContent = fmt(left); id = setInterval(tick, 1000); },
    stop() { clearInterval(id); id = null; },
    reset() { clearInterval(id); id = null; d.classList.remove("done", "low"); d.textContent = "--:--"; }
  };
}

};

/* ---------------- Từ vựng ---------------- */
RENDER["tu-vung"] = function () {
  const root = $("#v-tu-vung"); root.replaceChildren();
  const decks = Object.keys(VOCAB);
  let deck = decks[0], mode = "the", i = 0, flipped = false, onlyNew = false, order = [];
  const deckChips = el("div", { class: "row" });
  const modeChips = el("div", { class: "row" });
  const rangeBar = el("div", { class: "card stack", style: "padding:12px 14px;gap:10px" });
  const body = el("div", { class: "stack" });
  root.append(el("div", { class: "sec-head" }, el("h2", { text: "Từ vựng" }),
    el("p", { class: "lede", text: "Hai bộ đầu lấy từ danh sách từ trong tài liệu tuần 1 của trung tâm. Các bộ còn lại là chủ đề hay gặp trong phần Viết và Nói. Mỗi ngày chọn một nhóm nhỏ để học, thẻ trong nhóm được trộn ngẫu nhiên." })),
    deckChips, rangeBar, modeChips, body);
  function getRange() {
    const n = VOCAB[deck].length, r = (S.ranges || {})[deck];
    return r ? [Math.min(Math.max(1, r[0]), n), Math.min(Math.max(1, r[1]), n)] : [1, n];
  }
  function inRange() { const [a, b] = getRange(); return VOCAB[deck].slice(a - 1, b); }

    save(); reorder(true); drawRange(); draw();
  }
  function drawRange() {
    const all = VOCAB[deck], n = all.length, [a, b] = getRange(), size = S.groupSize || 15;
    const isAll = a === 1 && b === n;

    for (let s = 1; s <= n; s += size) groups.push([s, Math.min(n, s + size - 1)]);
    const chip = (label, ga, gb, on) => el("button", { class: "chip", "aria-pressed": String(on), text: label, onclick: () => setRange(ga, gb) });
    const sizeSel = el("select", { id: "grp-size", "aria-label": "Số từ mỗi nhóm", onchange: e => { S.groupSize = parseInt(e.target.value, 10); save(); drawRange(); } },
      [10, 15, 20, 30].map(v => el("option", { value: String(v), text: `${v} từ/nhóm`, selected: v === size })));
    const from = el("input", { type: "number", id: "rg-from", min: "1", max: String(n), value: String(a), style: "width:72px", "aria-label": "Từ số" });
    const to = el("input", { type: "number", id: "rg-to", min: "1", max: String(n), value: String(b), style: "width:72px", "aria-label": "Đến số" });
    rangeBar.replaceChildren(
      el("div", { class: "row between" }, el("b", { text: "Học theo nhóm" }), sizeSel),
      el("div", { class: "row" }, chip(`Tất cả (${n})`, 1, n, isAll), groups.map(([ga, gb]) => {
        const done = all.slice(ga - 1, gb).every(w => S.known[w[0]]);
        return chip(`${ga}–${gb}${done ? " ✓" : ""}`, ga, gb, !isAll && a === ga && b === gb);
      })),
      el("div", { class: "row small" }, "Hoặc tự chọn: từ số", from, "đến số", to, el("button", { class: "btn", text: "Áp dụng", onclick: () => setRange(+from.value, +to.value) })),
      el("p", { class: "small muted", text: isAll ? "Đang học cả bộ. Chọn một nhóm để học ít từ hơn mỗi ngày; nhóm có dấu ✓ là đã thuộc hết." : `Đang học từ số ${a} đến ${b} (${b - a + 1} từ). Thẻ đã được trộn; bấm “Trộn thẻ” để trộn lại.` }));
  }
  function cards() { const all = inRange(); return onlyNew ? all.filter(w => !S.known[w[0]]) : all; }
  function reorder(sh) { const c = cards(); order = sh ? shuffle(c.map((_, k) => k)) : c.map((_, k) => k); i = 0; flipped = false; }
  function drawChips() {
    deckChips.replaceChildren(...decks.map(d => el("button", { class: "chip", "aria-pressed": String(d === deck), text: `${d} (${VOCAB[d].length})`, onclick: () => { deck = d; reorder(!!(S.ranges || {})[d]); drawChips(); drawRange(); draw(); } })));
    modeChips.replaceChildren(
      ...[["the", "Thẻ ghi nhớ"], ["quiz", "Trắc nghiệm 10 câu"], ["go", "Gõ từ tiếng Anh"], ["list", "Danh sách"]].map(([m, t]) => el("button", { class: "chip", "aria-pressed": String(m === mode), text: t, onclick: () => { mode = m; drawChips(); draw(); } })),
      el("label", { class: "row small", for: "only-new", style: "margin-left:8px" }, el("input", { type: "checkbox", id: "only-new", checked: onlyNew, onchange: e => { onlyNew = e.target.checked; reorder(false); draw(); } }), "Chỉ từ chưa thuộc"));
  }
  function drawCard() {
    PRON.abort();
    const c = cards();
    if (!c.length) { body.replaceChildren(el("div", { class: "card" }, el("p", { text: "Bạn đã thuộc hết bộ này. Bỏ chọn “Chỉ từ chưa thuộc” để ôn lại." }))); return; }
    if (i >= order.length) i = 0;
    const w = c[order[i]];
    const known = !!S.known[w[0]];
    const card = el("div", { class: "card flash" + (known ? " known" : ""), tabindex: "0", role: "button", "aria-label": "Lật thẻ", onclick: () => { flipped = !flipped; drawCard(); }, onkeydown: e => { if (e.key === " " || e.key === "Enter") { e.preventDefault(); flipped = !flipped; drawCard(); } } },
      el("span", { class: "hint", text: `Từ số ${VOCAB[deck].indexOf(w) + 1}` }),
      el("span", { class: "w", text: w[0] }),
      flipped ? el("span", { class: "m", text: w[1] }) : el("span", { class: "hint", text: "Bấm để xem nghĩa" }),

    const next = () => { if (onlyNew) { order = cards().map((_, k) => k); if (i >= order.length) i = 0; } else i = (i + 1) % order.length; flipped = false; drawCard(); };
    body.replaceChildren(card,
      el("div", { class: "row between" },
        el("div", { class: "row" }, el("button", { class: "btn", text: "←", "aria-label": "Thẻ trước", onclick: () => { i = (i - 1 + order.length) % order.length; flipped = false; drawCard(); } }),
          el("span", { class: "prog", text: `${i + 1}/${order.length}` }),
          el("button", { class: "btn", text: "→", "aria-label": "Thẻ sau", onclick: next })),
        el("div", { class: "row" }, el("button", { class: "btn", text: "Nghe phát âm", onclick: e => { e.stopPropagation(); TTS.speak(w[0].replace(/\(.*?\)/g, "")); } }),
          el("button", { class: "btn", text: "Trộn thẻ", onclick: () => { reorder(true); drawCard(); } }))),
      el("div", { class: "row" }, el("button", { class: "btn", text: "Chưa thuộc", onclick: () => markK(false) }), el("button", { class: "btn primary", text: "Đã thuộc", onclick: () => markK(true) })),
      el("p", { class: "prog", text: `Đã thuộc ${inRange().filter(x => S.known[x[0]]).length}/${inRange().length} từ trong nhóm này` }),
      pronBox(w[0]));
  }
  function drawQuiz() {
    const pool = inRange();
    const distract = pool.length >= 4 ? pool : VOCAB[deck]; // tiny ranges borrow wrong answers from the whole deck
    const qs = shuffle(pool).slice(0, Math.min(10, pool.length));
    let score = 0, done = 0;
    const wrap = el("div", { class: "card stack" });
    const tally = el("p", { class: "prog" });
    const upd = () => tally.textContent = `Đúng ${score}/${done} · ${qs.length - done} câu còn lại`;
    qs.forEach((w, qi) => {
      const opts = shuffle([w, ...shuffle(distract.filter(x => x !== w)).slice(0, 3)]);
      const fb = el("span", { class: "small" });
      const btns = opts.map((o, k) => el("button", { class: "opt", type: "button", onclick: () => {
        if (btns[0].disabled) return; done++;
        const ok = o === w; if (ok) { score++; S.known[w[0]] = 1; save(); }
        btns.forEach((b, j) => { b.disabled = true; if (opts[j] === w) b.classList.add("correct"); else if (j === k) b.classList.add("wrong"); if (j === k) b.classList.add("picked"); });
        upd(); markDay();
      } }, el("span", { class: "L", text: LETTERS[k] }), el("span", { text: o[1] })));
      wrap.append(el("div", { class: "q" }, el("div", { class: "row between" }, el("span", { class: "qt", text: `${qi + 1}. ${w[0]}` }), el("button", { class: "btn speak-btn", text: "Nghe", onclick: () => TTS.speak(w[0].replace(/\(.*?\)/g, "")) })), el("div", { class: "opts" }, btns), fb));
    });
    upd();
    body.replaceChildren(el("div", { class: "row between" }, tally, el("button", { class: "btn", text: "Đề khác", onclick: drawQuiz })), wrap);
  }
  function drawList() {
    body.replaceChildren(el("div", { class: "card" }, el("div", { class: "wordlist" }, inRange().map(w => el("div", { class: S.known[w[0]] ? "k" : "" }, el("span", { class: "muted num", text: `${VOCAB[deck].indexOf(w) + 1}. ` }), el("b", { text: w[0] }), " – ", w[1])))));
  }
  function drawType() {
    // Vietnamese meaning → type the English word; grammar labels like "(v)" are not required
    const norm = s => s.toLowerCase().replace(/\(.*?\)/g, "").replace(/[’`]/g, "'").replace(/\s+/g, " ").trim();
    const items = shuffle(inRange());
    let score = 0, done = 0;
    const tally = el("p", { class: "prog" });

    const wrap = el("div", { class: "card stack" });

        el("div", { class: "row between" }, el("span", { class: "qt", text: `${qi + 1}. ${w[1]}` }), el("span", { class: "small muted", text: `Từ số ${VOCAB[deck].indexOf(w) + 1}` })),
        el("div", { class: "row" }, inp, mark, el("button", { class: "btn", text: "Kiểm tra", onclick: check }), hint, reveal),

      el("p", { class: "small muted", text: "Gõ xong bấm Enter. Không cần gõ phần trong ngoặc như (v), (adj). Đúng ngay lần đầu thì từ được tính là đã thuộc." }), wrap);

  reorder(!!(S.ranges || {})[deck]); drawChips(); drawRange(); draw();
};

RENDER["ngu-phap"] = function () {
  const root = $("#v-ngu-phap"); root.replaceChildren();
  root.append(el("div", { class: "sec-head" }, el("h2", { text: "Ngữ pháp nền cho Viết" }),
    el("p", { class: "lede", text: "Bốn nhóm này bám theo phần ôn tập chương 1 trong file Writing tuần 1: cấu trúc câu, thì, động từ khuyết thiếu, liên từ và từ nối. Câu đúng được lưu vào tiến độ." })));
